<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "BC"; src: url("BarlowCondensed_700Bold.ttf"); }
@font-face { font-family: "B"; src: url("Barlow_500Medium.ttf"); }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #F6F7F9; }
.wrap { position: relative; width: 1024px; height: 500px; }
.bar { position: absolute; left: 0; top: 0; width: 1024px; height: 8px; background: #C22127; }
.copy { position: absolute; left: 64px; top: 92px; width: 520px; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { width: 72px; height: 72px; border-radius: 16px; }
.brand span { font-family: "BC"; font-size: 54px; letter-spacing: 1px; color: #16181D; }
h1 { font-family: "BC"; font-size: 58px; line-height: 0.98; margin: 34px 0 0; color: #16181D; text-transform: uppercase; }
p { font-family: "B"; font-size: 24px; color: #4A5260; margin: 18px 0 0; }
.phone { position: absolute; right: 70px; top: 40px; width: 300px; height: 652px; border-radius: 44px; background: #16181D; padding: 10px; box-sizing: border-box; box-shadow: 0 20px 50px rgba(22,24,29,0.25); }
.phone img { width: 100%; border-radius: 34px; display: block; }
</style></head>
<body><div class="wrap">
  <div class="bar"></div>
  <div class="copy">
    <div class="brand"><img src="icon.png"><span>HUBWELD</span></div>
    <h1>Hire welders.<br>Find welding jobs.<br>Buy supplies.</h1>
    <p>One app for customers, welders and suppliers.</p>
  </div>
  <div class="phone"><img src="shot.jpg"></div>
</div></body></html>
